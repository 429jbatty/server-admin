global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - 192.168.1.184:9100
        labels:
          host: proxmox

  - job_name: pve
    metrics_path: /pve
    params:
      module:
        - default
      cluster:
        - "1"
      node:
        - "1"
    static_configs:
      - targets:
          - 192.168.1.184
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: home-assistant
    scrape_interval: 60s
    metrics_path: /api/prometheus
    authorization:
      credentials_file: /etc/prometheus/secrets/home-assistant-prometheus-token
    static_configs:
      - targets:
          - 192.168.1.187:8123
        labels:
          host: homeassistant

  - job_name: albumary-cloudflare-exporter
    scrape_interval: 60s
    static_configs:
      - targets:
          - albumary-cloudflare-exporter:9210
        labels:
          hostname: app.albumary.net

  - job_name: blackbox-albumary
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://app.albumary.net
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
